name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check index.js
      - name: Build frontend artifacts
        run: node build.mjs
      - name: Verify dist is committed
        run: git diff --exit-code -- frontend/dist
      - name: Unit tests
        run: node --test test/*.test.js
